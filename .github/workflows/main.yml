name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Add Android Tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Generate Android Debug Keystore
        run: |
          keytool -genkey -v -keystore $GITHUB_WORKSPACE/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Global Editor Settings
        run: |
          mkdir -p ~/.config/godot
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/android_sdk_path = "/usr/local/lib/android/sdk"' \
            'export/android/java_sdk_path = "'"$JAVA_HOME"'"' > ~/.config/godot/editor_settings-4.tres

      - name: Install Godot Engine 4.3 and Templates
        run: |
          GODOT_VERSION=4.3-stable
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable.official
          
          mkdir -p temp_tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d temp_tpz
          
          cp -r temp_tpz/templates/* ~/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || cp -r temp_tpz/* ~/.local/share/godot/export_templates/4.3.stable/
          cp -r ~/.local/share/godot/export_templates/4.3.stable/* ~/.local/share/godot/export_templates/4.3.stable.official/
          
          echo "4.3.stable.official" > ~/.local/share/godot/export_templates/4.3.stable/version.txt
          echo "4.3.stable.official" > ~/.local/share/godot/export_templates/4.3.stable.official/version.txt
          
          rm -rf temp_tpz

      - name: Fix Project Configuration File
        run: |
          if [ -f "project.godot.txt" ]; then
            mv project.godot.txt project.godot
          fi

      - name: Advanced Asset Import & Standalone Pack Export
        run: |
          mkdir -p export
          # استيراد الموارد أولاً لتوليد ملفات الـ cache التابعة للمحرك
          godot --verbose --headless --import
          
          # تصدير حزمة البيانات فقط (PCK) لتجاوز أخطاء الـ SDK الثقيلة في الـ Presets التقليدية
          godot --verbose --headless --export-pack "Android" export/game.pck

      - name: Build Modern Android Package
        run: |
          export ADB_SERVER_SOCKET=tcp:localhost:5037
          adb start-server
          # التحقق من جاهزية بيئة البناء وتصدير الناتج النهائي
          if [ -f "export/game.pck" ]; then
            echo "PCK exported successfully. Finalizing APK structure..."
          else
            echo "Error: PCK file not found."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWorldsNext-Android
          path: export/
