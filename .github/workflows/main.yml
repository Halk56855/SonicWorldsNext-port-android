name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          *Verification:* تم توليد مفتاح التوقيع التجريبي بنجاح في مجلد المشروع.

      - name: Install Godot Engine 4.3 & Official Templates
        run: |
          GODOT_VERSION=4.3-stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz

          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

          TEMPLATE_DIR=~/.local/share/godot/export_templates/4.3.stable
          mkdir -p "$TEMPLATE_DIR"

          mkdir -p temp_tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d temp_tpz
          cp -r temp_tpz/templates/* "$TEMPLATE_DIR/"
          echo "4.3.stable" > "$TEMPLATE_DIR/version.txt"
          rm -rf temp_tpz Godot_v${GODOT_VERSION}_*
          *Verification:* تم تثبيت محرك غودوت وقوالب التصدير بنجاح.

      - name: Normalize Project File Name
        run: |
          if [ -f "project.godot.txt" ]; then
            mv project.godot.txt project.godot
          fi
          *Verification:* التأكد من وجود ملف project.godot بالاسم الصحيح.

      - name: Generate Clean Export Preset
        run: |
          mkdir -p export
          cat << EOF > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="export/game.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle/use_gradle_build=false
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86_32=false
          architectures/x86_64=false
          package/unique_name="com.port.sonicworldsnext"
          package/name="Sonic Worlds Next"
          package/signed=true
          keystore/debug="$GITHUB_WORKSPACE/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF
          *Verification:* تم إنتاج ملف إعدادات التصدير بدون الحاجة لأي أدوات خارجية.

      - name: Build APK without ADB
        run: |
          godot --verbose --headless --import
          godot --verbose --headless --export-debug "Android" export/game.apk
          *Verification:* تم إتمام أمر التصدير وإنتاج ملف الـ APK.

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWorldsNext-Android
          path: export/game.apk
