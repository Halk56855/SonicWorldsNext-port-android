name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Generate Android Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          mkdir -p ~/.local/share/godot

      - name: Install Godot Engine 4.3 and Templates
        run: |
          GODOT_VERSION=4.3-stable
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p temp_templates
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d temp_templates
          find temp_templates -type f -exec mv {} ~/.local/share/godot/export_templates/4.3.stable/ \;
          
          # استخراج قالب بناء أندرويد لتمكين التصدير عبر Gradle
          mkdir -p android/build
          if [ -f ~/.local/share/godot/export_templates/4.3.stable/android_source.zip ]; then
            unzip -q ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build
          fi
          rm -rf temp_templates

      - name: Create Export Preset Configuration
        run: |
          mkdir -p export
          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="export/game.apk"
          patchable_packs=false
          custom_template/debug=""
          custom_template/release=""

          [preset.0.options]
          package/unique_name="com.port.sonicworlds"
          package/app_name="Sonic Worlds Next"
          target_sdk=34
          min_sdk=24
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release="debug.keystore"
          keystore/release_user="androiddebugkey"
          keystore/release_password="android"
          gradle_build/use_gradle_build=true
          EOF

      - name: Configure Godot Android SDK Path
        run: |
          mkdir -p ~/.config/godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.tres
          [resource]
          export/android/android_sdk_path ="/usr/local/lib/android/sdk"
          EOF

      - name: Build APK with Godot
        run: |
          mkdir -p export
          godot --verbose --headless --export-release "Android" export/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWorldsNext-Android
          path: export/game.apk
