name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Add Android Tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Verification: التأكد من إضافة مسارات أدوات الأندرويد إلى متغير PATH بنجاح.

      - name: Generate Android Debug Keystore
        run: |
          keytool -genkey -v -keystore $GITHUB_WORKSPACE/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          # Verification: التحقق من توليد ملف debug.keystore في جذر مستودع المشروع.

      - name: Configure Godot Global Editor Settings for Android & JDK
        run: |
          mkdir -p ~/.config/godot
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/android_sdk_path = "/usr/local/lib/android/sdk"' \
            'export/android/java_sdk_path = "'"$JAVA_HOME"'"' \
            'export/android/debug_keystore = "'"$GITHUB_WORKSPACE/debug.keystore"'"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' > ~/.config/godot/editor_settings-4.tres
          # Verification: التحقق من كتابة مسارات الأندرويد ومفتاح التوقيع في ملف إعدادات المحرر.

      - name: Install Godot Engine 4.3 and Templates
        run: |
          GODOT_VERSION=4.3-stable
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable.official
          
          mkdir -p temp_tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d temp_tpz
          
          cp -r temp_tpz/templates/* ~/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || cp -r temp_tpz/* ~/.local/share/godot/export_templates/4.3.stable/
          cp -r ~/.local/share/godot/export_templates/4.3.stable/* ~/.local/share/godot/export_templates/4.3.stable.official/
          
          rm -rf temp_tpz
          # Verification: التأكد من تثبيت قوالب التصدير في مجلد 4.3.stable.official الخاص بغودوت 4.3.

      - name: Ensure Valid Project Configuration and Icon
        run: |
          if [ ! -f "project.godot" ]; then
            touch project.godot
          fi
          if ! grep -q "config/name" project.godot; then
            echo -e '[application]\n\nconfig/name="Sonic Worlds Next"\nconfig/icon="res://icon.svg"' >> project.godot
          fi
          if [ ! -f "icon.svg" ]; then
            echo '<svg height="128" width="128" xmlns="http://www.w3.org/2000/svg"><circle cx="64" cy="64" r="60" fill="#3366cc"/></svg>' > icon.svg
          fi
          # Verification: التأكد من توفر ملفات التكوين الأساسية وأيقونة المشروع.

      - name: Create Clean Godot 4.3 Export Preset
        run: |
          rm -f export_presets.cfg
          mkdir -p export
          printf '%s\n' \
            '[preset.0]' \
            'name="Android"' \
            'platform="Android"' \
            'runnable=true' \
            'dedicated_server=false' \
            'custom_features=""' \
            'export_filter="all_resources"' \
            'include_filter=""' \
            'exclude_filter=""' \
            'export_path="export/game.apk"' \
            'patchable_packs=false' \
            'custom_template/debug=""' \
            'custom_template/release=""' \
            '' \
            '[preset.0.options]' \
            'package/unique_name="com.port.sonicworldsnext"' \
            'package/app_name="Sonic Worlds Next"' \
            'version/code=1' \
            'version/name="1.0"' \
            'screen/orientation=2' \
            'graphics/high_density_icons=true' \
            'architectures/arm64-v8a=true' \
            'architectures/armeabi-v7a=false' \
            'architectures/x86=false' \
            'architectures/x86_64=false' > export_presets.cfg
          # Verification: التأكد من خلو ملف export_presets.cfg من الحقول الفارغة وتوليده بنجاح.

      - name: Import Project Assets
        run: |
          godot --verbose --headless --import
          # Verification: اكتمال استيراد الموارد دون إرجاع أخطاء.

      - name: Build APK with Godot
        run: |
          mkdir -p export
          godot --verbose --headless --export-debug "Android" export/game.apk
          # Verification: تجاوز خطأ التكوين بنجاح وإنشاء ملف export/game.apk.

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWorldsNext-Android
          path: export/game.apk
