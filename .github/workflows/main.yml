name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools cmdline-tools;latest

      - name: Add Android Tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Start ADB Server
        run: |
          adb kill-server || true
          unset ADB_SERVER_SOCKET
          adb start-server

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore $GITHUB_WORKSPACE/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot 4.3 Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "WORKSPACE_KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "JAVA_HOME_PATH"
          EOF
          sed -i "s|WORKSPACE_KEYSTORE|$GITHUB_WORKSPACE/debug.keystore|g" ~/.config/godot/editor_settings-4.tres
          sed -i "s|JAVA_HOME_PATH|$JAVA_HOME|g" ~/.config/godot/editor_settings-4.tres

      - name: Install Godot Engine 4.3 & Official Export Templates
        run: |
          GODOT_VERSION=4.3-stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz

          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

          TEMPLATE_DIR=~/.local/share/godot/export_templates/4.3.stable
          mkdir -p "$TEMPLATE_DIR"

          mkdir -p temp_tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d temp_tpz
          cp -r temp_tpz/templates/* "$TEMPLATE_DIR/"
          rm -rf temp_tpz Godot_v${GODOT_VERSION}_*

      - name: Normalize Project File Name
        run: |
          if [ -f "project.godot.txt" ]; then
            mv project.godot.txt project.godot
          fi

      - name: Create Valid Export Preset
        run: |
          mkdir -p export
          cat << EOF > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="export/game.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle/use_gradle_build=false
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86_32=false
          architectures/x86_64=false
          package/unique_name="com.port.sonicworldsnext"
          package/name="Sonic Worlds Next"
          package/signed=true
          keystore/debug="$GITHUB_WORKSPACE/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

      - name: Import Assets & Build APK
        run: |
          godot --verbose --headless --import
          godot --verbose --headless --export-debug "Android" export/game.apk

      - name: Verify & Upload APK
        run: |
          if [ -f "export/game.apk" ]; then
            echo "Build successful! APK size:"
            ls -lh export/game.apk
          else
            echo "APK generation failed."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWorldsNext-Android
          path: export/game.apk
