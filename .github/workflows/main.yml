name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot Engine 4.7.2 & Official Templates
        run: |
          GODOT_VERSION="4.7.2"
          
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz

          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TEMPLATE_DIR"

          mkdir -p temp_tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d temp_tpz
          cp -r temp_tpz/templates/* "$TEMPLATE_DIR/"
          echo "${GODOT_VERSION}.stable" > "$TEMPLATE_DIR/version.txt"
          rm -rf temp_tpz Godot_v${GODOT_VERSION}*

      - name: Generate Visible Pixel Touch Controls & Normalize Project
        run: |
          if [ -f "project.godot.txt" ]; then
            mv project.godot.txt project.godot
          fi
          
          mkdir -p Scripts/Misc Graphics/TouchControls

          # توليد رسومات أزرار واضحة ومرئية تماماً بلون مميز لكي تظهر بوضوح على شاشة الهاتف
          cat << 'EOF' > generate_buttons.py
          import os
          from PIL import Image, ImageDraw, ImageFont

          os.makedirs("Graphics/TouchControls", exist_ok=True)

          def create_button(filename, label_text):
              size = (140, 140)
              img = Image.new("RGBA", size, (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              # رسم خلفية دائرية واضحة وبارزة
              draw.ellipse([5, 5, 135, 135], fill=(20, 20, 30, 220), outline=(255, 255, 255, 200), width=6)
              draw.ellipse([15, 15, 125, 125], fill=(50, 50, 70, 240))
              
              if label_text:
                  # رسم النص أو الحرف داخل الزر
                  try:
                      font = ImageFont.load_default()
                  except:
                      font = None
                  draw.text((55, 45), label_text, fill=(255, 255, 255, 255), font=font)
                  
              img.save(f"Graphics/TouchControls/{filename}.png")

          create_button("btn_left", "◄")
          create_button("btn_right", "►")
          create_button("btn_jump", "A")
          create_button("btn_start", "START")
          EOF

          python3 -m pip install Pillow > /dev/null 2>&1 || true
          python3 generate_buttons.py

          # سكريبت لإنشاء الأزرار وتثبيتها بشكل مرئي على الشاشة مع دعم زر Start
          cat << 'EOF' > Scripts/Misc/VirtualControls.gd
          extends CanvasLayer

          func _ready():
              if DisplayServer.get_name() == "headless":
                  return
              
              # زر التحرك لليسار
              var left_btn = TouchScreenButton.new()
              if ResourceLoader.exists("res://Graphics/TouchControls/btn_left.png"):
                  left_btn.normal = load("res://Graphics/TouchControls/btn_left.png")
              left_btn.action = "ui_left"
              left_btn.position = Vector2(50, 420)
              add_child(left_btn)

              # زر التحرك لليمين
              var right_btn = TouchScreenButton.new()
              if ResourceLoader.exists("res://Graphics/TouchControls/btn_right.png"):
                  right_btn.normal = load("res://Graphics/TouchControls/btn_right.png")
              right_btn.action = "ui_right"
              right_btn.position = Vector2(200, 420)
              add_child(right_btn)

              # زر القفز (A)
              var jump_btn = TouchScreenButton.new()
              if ResourceLoader.exists("res://Graphics/TouchControls/btn_jump.png"):
                  jump_btn.normal = load("res://Graphics/TouchControls/btn_jump.png")
              jump_btn.action = "jump"
              jump_btn.position = Vector2(1000, 420)
              add_child(jump_btn)

              # زر البدء (START) لتجاوز شاشة المقدمة
              var start_btn = TouchScreenButton.new()
              if ResourceLoader.exists("res://Graphics/TouchControls/btn_start.png"):
                  start_btn.normal = load("res://Graphics/TouchControls/btn_start.png")
              start_btn.action = "ui_accept"
              start_btn.position = Vector2(520, 520)
              add_child(start_btn)
          EOF

          if ! grep -q "rendering/textures/vram_compression/import_etc2_astc" project.godot; then
            echo "" >> project.godot
            echo "[rendering]" >> project.godot
            echo "textures/vram_compression/import_etc2_astc=true" >> project.godot
          fi

          if ! grep -q "VirtualControls" project.godot; then
            echo "" >> project.godot
            echo "[autoload]" >> project.godot
            echo "VirtualControls=\"*res://Scripts/Misc/VirtualControls.gd\"" >> project.godot
          fi

      - name: Generate Clean Export Preset
        run: |
          mkdir -p export
          cat << EOF > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="export/game.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle/use_gradle_build=false
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86_32=false
          architectures/x86_64=false
          package/unique_name="com.port.sonicworldsnext"
          package/name="Sonic Worlds Next"
          package/signed=true
          keystore/debug="$GITHUB_WORKSPACE/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

      - name: Build APK with Godot 4.7.2 (Headless)
        run: |
          godot --verbose --headless --import
          godot --verbose --headless --export-debug "Android" export/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWorldsNext-Android
          path: export/game.apk
