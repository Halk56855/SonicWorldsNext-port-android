name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Start ADB Server
        run: |
          adb start-server || true

      - name: Generate Android Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Editor Settings for Android
        run: |
          mkdir -p ~/.config/godot
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/android_sdk_path = "/usr/local/lib/android/sdk"' \
            'export/android/debug_keystore = "res://debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' > ~/.config/godot/editor_settings-4.tres

      - name: Install Godot Engine 4.3 and Templates
        run: |
          GODOT_VERSION=4.3-stable
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p temp_templates
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d temp_templates
          find temp_templates -type f -exec mv {} ~/.local/share/godot/export_templates/4.3.stable/ \;
          rm -rf temp_templates

      - name: Create Complete Export Preset
        run: |
          rm -f export_presets.cfg
          mkdir -p export
          printf '%s\n' \
            '[preset.0]' \
            'name="Android"' \
            'platform="Android"' \
            'runnable=true' \
            'dedicated_server=false' \
            'custom_features=""' \
            'export_filter="all_resources"' \
            'include_filter=""' \
            'exclude_filter=""' \
            'export_path="export/game.apk"' \
            'patchable_packs=false' \
            'custom_template/debug=""' \
            'custom_template/release=""' \
            '' \
            '[preset.0.options]' \
            'package/unique_name="com.port.sonicworldsnext"' \
            'package/app_name="Sonic Worlds Next"' \
            'version/code=1' \
            'version/name="1.0"' \
            'screen/orientation=2' \
            'graphics/high_density_icons=true' \
            'gradle/use_gradle_build=true' \
            'architectures/arm64-v8a=true' \
            'architectures/armeabi-v7a=false' \
            'architectures/x86=false' \
            'architectures/x86_64=false' \
            'keystore/debug="res://debug.keystore"' \
            'keystore/debug_user="androiddebugkey"' \
            'keystore/debug_password="android"' \
            'keystore/release=""' \
            'keystore/release_user=""' \
            'keystore/release_password=""' > export_presets.cfg

      - name: Import Project Assets
        run: |
          godot --verbose --headless --import

      - name: Build APK with Godot
        run: |
          mkdir -p export
          godot --verbose --headless --export-debug "Android" export/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWorldsNext-Android
          path: export/game.apk
