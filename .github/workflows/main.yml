name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot Engine 4.7.2 & Official Templates
        run: |
          GODOT_VERSION="4.7.2"
          
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz

          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TEMPLATE_DIR"

          mkdir -p temp_tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d temp_tpz
          cp -r temp_tpz/templates/* "$TEMPLATE_DIR/"
          echo "${GODOT_VERSION}.stable" > "$TEMPLATE_DIR/version.txt"
          rm -rf temp_tpz Godot_v${GODOT_VERSION}*

      - name: Download Touch Buttons and Inject All Controls
        run: |
          if [ -f "project.godot.txt" ]; then
            mv project.godot.txt project.godot
          fi
          
          mkdir -p Scripts/Misc Graphics/TouchControls

          # 1. تحميل حزمة أزرار اللمس الخارجية واستخراج الرسوميات
          wget -q "https://filecache37.gamebanana.com/mods/refined_mtc_3f59c.zip" -O controls.zip
          unzip -o controls.zip -d extracted_controls/ || true
          find extracted_controls/ -type f \( -name "*.png" -o -name "*.webp" \) -exec cp {} Graphics/TouchControls/ \;
          rm -rf controls.zip extracted_controls

          # 2. توليد صور احتياطية لجميع الأزرار المطلوبة (فوق، تحت، يسار، يمين، a, s, d, z, x, c, enter)
          cat << 'EOF' > generate_buttons.py
          import os
          from PIL import Image, ImageDraw

          os.makedirs("Graphics/TouchControls", exist_ok=True)

          buttons = [
              "btn_up", "btn_down", "btn_left", "btn_right",
              "btn_a", "btn_s", "btn_d", "btn_z", "btn_x", "btn_c", "btn_enter"
          ]

          for b in buttons:
              path = f"Graphics/TouchControls/{b}.png"
              if not os.path.exists(path):
                  size = (260, 90) if b == "btn_enter" else (100, 100)
                  img = Image.new("RGBA", size, (0, 0, 0, 0))
                  draw = ImageDraw.Draw(img)
                  if b == "btn_enter":
                      draw.rectangle([5, 5, 255, 85], fill=(30, 30, 60, 240), outline=(255, 255, 255, 255), width=5)
                  else:
                      draw.ellipse([5, 5, 95, 95], fill=(30, 30, 60, 240), outline=(255, 255, 255, 255), width=5)
                  img.save(path)
          EOF

          python3 -m pip install Pillow > /dev/null 2>&1 || true
          python3 generate_buttons.py

          # 3. إنشاء سكربت التحكم الشامل لعرض كافة الأزرار المطلوبة على شاشة الهاتف
          cat << 'EOF' > Scripts/Misc/VirtualControls.gd
          extends CanvasLayer

          func _ready():
              if DisplayServer.get_name() == "headless":
                  return
              
              layer = 999
              
              var control_node = Control.new()
              control_node.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
              control_node.mouse_filter = Control.MOUSE_FILTER_IGNORE
              add_child(control_node)

              # D-Pad (فوق، تحت، يسار، يمين)
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_left.png", Vector2(40, 420), "ui_left", KEY_LEFT))
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_right.png", Vector2(160, 420), "ui_right", KEY_RIGHT))
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_up.png", Vector2(100, 360), "ui_up", KEY_UP))
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_down.png", Vector2(100, 480), "ui_down", KEY_DOWN))

              # أزرار الحروف (Z, X, C, A, S, D)
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_z.png", Vector2(680, 480), "z", KEY_Z))
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_x.png", Vector2(790, 480), "x", KEY_X))
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_c.png", Vector2(900, 480), "c", KEY_C))
              
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_a.png", Vector2(680, 370), "a", KEY_A))
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_s.png", Vector2(790, 370), "s", KEY_S))
              control_node.add_child(create_btn("res://Graphics/TouchControls/btn_d.png", Vector2(900, 370), "d", KEY_D))

              # زر Enter للبدء وتجاوز شاشة Press Start
              var enter_btn = create_btn("res://Graphics/TouchControls/btn_enter.png", Vector2(370, 500), "ui_accept", KEY_ENTER)
              control_node.add_child(enter_btn)

          func create_btn(tex_path: String, pos: Vector2, action_name: String, key_code: Key) -> TextureButton:
              var btn = TextureButton.new()
              if ResourceLoader.exists(tex_path):
                  btn.texture_normal = load(tex_path)
              btn.position = pos
              btn.expand_mode = TextureButton.EXPAND_IGNORE_SIZE
              btn.custom_minimum_size = Vector2(260, 90) if action_name == "ui_accept" else Vector2(100, 100)
              
              btn.button_down.connect(func():
                  Input.action_press(action_name)
                  var ev = InputEventKey.new()
                  ev.keycode = key_code
                  ev.pressed = true
                  Input.parse_input_event(ev)
              )
              btn.button_up.connect(func():
                  Input.action_release(action_name)
                  var ev = InputEventKey.new()
                  ev.keycode = key_code
                  ev.pressed = false
                  Input.parse_input_event(ev)
              )
              return btn
          EOF

          if ! grep -q "rendering/textures/vram_compression/import_etc2_astc" project.godot; then
            echo "" >> project.godot
            echo "[rendering]" >> project.godot
            echo "textures/vram_compression/import_etc2_astc=true" >> project.godot
          fi

          if ! grep -q "VirtualControls" project.godot; then
            echo "" >> project.godot
            echo "[autoload]" >> project.godot
            echo "VirtualControls=\"*res://Scripts/Misc/VirtualControls.gd\"" >> project.godot
          fi

      - name: Generate Clean Export Preset
        run: |
          mkdir -p export
          cat << EOF > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="export/game.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle/use_gradle_build=false
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86_32=false
          architectures/x86_64=false
          package/unique_name="com.port.sonicworldsnext"
          package/name="Sonic Worlds Next"
          package/signed=true
          keystore/debug="$GITHUB_WORKSPACE/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

      - name: Build APK with Godot 4.7.2 (Headless)
        run: |
          godot --verbose --headless --import
          godot --verbose --headless --export-debug "Android" export/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWorldsNext-Android
          path: export/game.apk
